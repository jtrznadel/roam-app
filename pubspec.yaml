name: roam
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.1.0
  lucide_icons_flutter: ^3.1.10
  get_it: ^9.2.1
  freezed_annotation: ^3.1.0
  flutter_bloc: ^9.1.1
  dartz: ^0.10.1
  google_fonts: ^8.0.2
  flutter_gen: ^5.12.0
  flutter_svg: ^2.2.3
  dio: ^5.9.2
  retrofit: ^4.9.2
  json_annotation: ^4.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
  flutter_gen_runner: ^5.12.0
  go_router_builder: ^4.2.0
  freezed: ^3.2.5
  retrofit_generator: ^10.2.5
  json_serializable: ^6.13.2

flutter:
  uses-material-design: true
  assets:
    - assets/svg/
    - assets/png/

flutter_intl:
  enabled: true

flutter_gen:
  assets:
    outputs:
      package_parameter_enabled: false
  integrations:
    flutter_svg: true
  colors:
    enabled: true
    outputs:
      class_name: AppColors
    inputs:
      - lib/core/theme/colors.xml
